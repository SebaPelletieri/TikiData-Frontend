@if (match) {
  <div class="match-card" [routerLink]="['/match', match.id]">
    <div class="match-card-header">
      <!-- CAMBIO AQUÍ: Usamos el nombre del campeonato dinámico -->
      <span class="championship-badge">
        {{ match.championship?.name || match.championshipName || 'TORNEO' }}
      </span>
      <span class="status-badge" [class.live]="match.status === 'En Vivo'">
        {{ match.status || 'Finalizado' }}
      </span>
    </div>

    <div class="scoreboard-grid">
      <!-- EQUIPO LOCAL -->
      <div class="team-column">
        <div class="shield-container">
          <img
            [src]="localTeam()?.shield || 'https://via.placeholder.com/45'"
            class="team-shield"
            [alt]="localTeam()?.name"
          />
        </div>
        <span class="team-title">{{ localTeam()?.name || 'Cargando...' }}</span>
      </div>

      <!-- MARCADOR CENTRAL -->
      <div class="score-center">
        <span class="score-num">{{ match.localGoals }}</span>
        <span class="score-separator">-</span>
        <span class="score-num">{{ match.awayGoals }}</span>
      </div>

      <!-- EQUIPO VISITANTE -->
      <div class="team-column">
        <div class="shield-container">
          <img
            [src]="awayTeam()?.shield || 'https://via.placeholder.com/45'"
            class="team-shield"
            [alt]="awayTeam()?.name"
          />
        </div>
        <span class="team-title">{{ awayTeam()?.name || 'Cargando...' }}</span>
      </div>
    </div>

    <div class="match-card-footer">
      <span>{{ match.date | date: 'dd/MM/yyyy - HH:mm' }}</span>
    </div>
  </div>
}
