<div class="team-form-container">
  <!-- Cabecera -->
  <div class="form-header">
    <div class="form-icon-box">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>
    </div>
    <div>
      <h3>Editar Campeonato</h3>
      <p>Configura las reglas, formato y datos generales del torneo.</p>
    </div>
  </div>

  <form [formGroup]="champForm" (ngSubmit)="onSubmit()" class="team-form">
    <!-- Nombre y Temporada -->
    <div class="form-row">
      <div class="form-group">
        <label>Nombre del Campeonato <span class="required">*</span></label>
        <input type="text" formControlName="name" placeholder="Ej. Liga Profesional" />
        <div
          class="error-feedback"
          *ngIf="champForm.get('name')?.invalid && champForm.get('name')?.touched"
        >
          <span class="error-text">El nombre es obligatorio.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Temporada</label>
        <input type="text" formControlName="season" placeholder="Ej. 2026 o 2026/2027" />
      </div>
    </div>

    <!-- País y Tipo de Torneo (Desplegables) -->
    <div class="form-row">
      <!-- Selector de País -->
      <div class="form-group">
        <label>País / Región <span class="required">*</span></label>
        <div class="custom-dropdown" [class.open]="isCountryOpen">
          <div class="dropdown-trigger" (click)="toggleCountryDropdown()">
            <span [class.placeholder]="!champForm.get('country')?.value">
              {{ champForm.get('country')?.value || 'Seleccionar país...' }}
            </span>
            <span class="triangle-icon"></span>
          </div>
          <ul class="dropdown-menu" *ngIf="isCountryOpen">
            <li class="dropdown-item" *ngFor="let c of countries" (click)="selectCountry(c)">
              <span>{{ c }}</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Selector de Tipo de Torneo -->
      <div class="form-group">
        <label>Tipo de Torneo <span class="required">*</span></label>
        <div class="custom-dropdown" [class.open]="isTypeOpen">
          <div class="dropdown-trigger" (click)="toggleTypeDropdown()">
            <span [class.placeholder]="!champForm.get('type')?.value">
              {{ champForm.get('type')?.value || 'Seleccionar tipo...' }}
            </span>
            <span class="triangle-icon"></span>
          </div>
          <ul class="dropdown-menu" *ngIf="isTypeOpen">
            <li class="dropdown-item" *ngFor="let t of types" (click)="selectType(t)">
              <span>{{ t }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- URL del Logo -->
    <div class="form-group">
      <label>URL del Logo <span class="required">*</span></label>
      <input type="text" formControlName="logo" placeholder="https://..." />
    </div>

    <!-- Botones de Acción -->
    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn-submit" [disabled]="champForm.invalid">
        Guardar Cambios
      </button>
    </div>
  </form>
</div>
