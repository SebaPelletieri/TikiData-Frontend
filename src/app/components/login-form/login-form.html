<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
  
  <div class="form-group">
    <label for="email">Correo electrónico</label>
    <input 
      id="email" 
      type="email" 
      formControlName="email" 
      placeholder="usuario@email.com"
      [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
    >
    @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
      <small class="error-text">Por favor, ingresa un correo electrónico válido.</small>
    }
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    
    <div style="position: relative; display: flex; align-items: center;">
      <input 
        id="password" 
        [type]="showPassword() ? 'text' : 'password'" 
        formControlName="password" 
        placeholder="******"
        style="width: 100%; padding-right: 40px;"
        [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      >
      
      <button 
        type="button" 
        (click)="togglePasswordVisibility()" 
        style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--text-secondary);"
      >
        @if (showPassword()) {
          <i class="fas fa-eye-slash"></i>
        } @else {
          <i class="fas fa-eye"></i>
        }
      </button>
    </div>

    @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
      <small class="error-text">La contraseña debe tener al menos 6 caracteres.</small>
    }
  </div>

  <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
    Iniciar Sesión
  </button>

  <p class="auth-footer">
    ¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a>
  </p>
</form>
