<nav class="navbar">
  <div class="navbar__brand">
    <img src="Logo-NavBar.png" alt="TikiData Logo" class="navbar__logo" />
  </div>

  <ul class="navbar__menu">
    <li
      class="navbar__item"
      routerLinkActive="navbar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <a routerLink="/" class="navbar__link"> <i class="fas fa-home navbar__icon"></i> Inicio </a>
    </li>

    <li class="navbar__item" routerLinkActive="navbar__item--active">
      <a routerLink="/en-vivo" class="navbar__link">
        <i class="fas fa-power-off navbar__icon"></i> En Vivo
      </a>
    </li>

    <li class="navbar__item" routerLinkActive="navbar__item--active">
      <a routerLink="/partidos" class="navbar__link">
        <i class="fas fa-futbol navbar__icon"></i> Partidos
      </a>
    </li>

    <li class="navbar__item" routerLinkActive="navbar__item--active">
      <a routerLink="/championships" class="navbar__link">
        <i class="fas fa-trophy navbar__icon"></i> Campeonatos
      </a>
    </li>

    <li class="navbar__item" routerLinkActive="navbar__item--active">
      <a routerLink="/teams" class="navbar__link">
        <i class="fas fa-shield-alt navbar__icon"></i> Equipos
      </a>
    </li>

    <li class="navbar__item" routerLinkActive="navbar__item--active">
      <a routerLink="/players" class="navbar__link">
        <i class="fas fa-users navbar__icon"></i> Jugadores
      </a>
    </li>
  </ul>

  <div class="navbar__utils">
    <div class="navbar__search">
      <i class="fas fa-search navbar__search-icon"></i>
      <input
        type="text"
        class="navbar__search-input"
        placeholder="Buscar equipos, ligas o jugadores..."
      />
    </div>

    <div class="navbar__theme">
      <i class="fas fa-sun navbar__theme-icon"></i>
      <label class="toggle-switch">
        <input type="checkbox" class="toggle-switch__input" checked />
        <span class="toggle-switch__slider"></span>
      </label>
    </div>

    @if (!authService.currentUser()) {
      <button routerLink="/login" class="navbar__profile" aria-label="Ingresar" title="Ingresar">
        <i class="fas fa-sign-in-alt"></i>
      </button>
    } @else {
      <button
        routerLink="/profile"
        class="navbar__profile"
        aria-label="Perfil de usuario"
        title="Mi Perfil"
      >
        <i class="fas fa-user"></i>
      </button>

      <button
        (click)="onLogout()"
        class="navbar__profile"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        <i class="fas fa-sign-out-alt" style="color: #ff4757"></i>
      </button>
    }
  </div>
</nav>
