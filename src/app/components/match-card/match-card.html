@if (match) {
  <div class="match-card" [routerLink]="['/match', match.id]">
    <div class="match-card-header">
      <span class="championship-badge">Liga Profesional</span>
      <span class="status-badge" [class.live]="match.status === 'En Vivo'">
        {{ match.status || 'Finalizado' }}
      </span>
    </div>

    <div class="scoreboard">
      <div class="team-info local">
        <span class="team-name">Local (ID: {{ match.localTeamID }})</span>
        <span class="score">{{ match.localGoals }}</span>
      </div>
      
      <div class="vs-divider">VS</div>

      <div class="team-info away">
        <span class="score">{{ match.awayGoals }}</span>
        <span class="team-name">Visitante (ID: {{ match.awayTeamID }})</span>
      </div>
    </div>

    <div class="match-card-footer">
      <span>{{ match.date | date:'dd/MM/yyyy HH:mm' }}</span>
    </div>
  </div>
}
