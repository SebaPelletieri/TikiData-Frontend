<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
  <div class="form-group">
    <label for="email">Correo electrónico</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="usuario@email.com"
      [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
    />

    @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
      <div class="error-feedback">
        <svg
          class="error-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="error-text">Por favor, ingresa un correo electrónico válido.</span>
      </div>
    }
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <div class="password-input-wrapper">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        placeholder="******"
        [class.input-error]="
          loginForm.get('password')?.invalid && loginForm.get('password')?.touched
        "
      />

      <button
        type="button"
        class="toggle-password-btn"
        (click)="togglePasswordVisibility()"
        aria-label="Alternar visibilidad de contraseña"
      >
        @if (showPassword()) {
          <svg
            class="eye-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
            ></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        } @else {
          <svg
            class="eye-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        }
      </button>
    </div>

    @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
      <div class="error-feedback">
        <svg
          class="error-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="error-text">La contraseña debe tener al menos 6 caracteres.</span>
      </div>
    }
  </div>

  <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Iniciar Sesión</button>

  <p class="auth-footer">¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
</form>
