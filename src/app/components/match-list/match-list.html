<div class="match-list-container">
  
  <!-- Barra de Filtros -->
  <div class="filter-bar">
    <button 
      [class.active]="selectedFilter() === 'TODOS'" 
      (click)="setFilter('TODOS')">
      Todos
    </button>
    <button 
      [class.active]="selectedFilter() === 'En Vivo'" 
      (click)="setFilter('En Vivo')">
      🔴 En Vivo
    </button>
    <button 
      [class.active]="selectedFilter() === 'Programado'" 
      (click)="setFilter('Programado')">
      Programados
    </button>
    <button 
      [class.active]="selectedFilter() === 'Finalizado'" 
      (click)="setFilter('Finalizado')">
      Finalizados
    </button>
  </div>

  <!-- Estado de carga -->
  @if (matchService.loading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Cargando partidos...</p>
    </div>
  }

  <!-- Mensaje de error -->
  @if (matchService.error()) {
    <div class="error-msg">{{ matchService.error() }}</div>
  }

  <!-- Grilla de partidos filtrada -->
  @if (!matchService.loading() && !matchService.error()) {
    <div class="matches-grid">
      @for (match of filteredMatches(); track match.id) {
        <app-match-card [match]="match"></app-match-card>
      } @empty {
        <div class="empty-state">
          <p>No hay partidos en esta categoría en este momento.</p>
        </div>
      }
    </div>
  }

</div>
