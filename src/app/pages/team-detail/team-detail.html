<div class="team-detail-container">
  @if (teamService.error()) {
    <div class="error-msg">{{ teamService.error() }}</div>
  }

  @if (teamService.teamActual(); as team) {
    <app-team-detail
      [team]="team"
      [stadium]="stadiumActual()"
      [championships]="activeChampionships()"
      [matches]="recentMatches()"
    />
  } @else if (!teamService.error()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Cargando información del equipo...</p>
    </div>
  }
</div>
